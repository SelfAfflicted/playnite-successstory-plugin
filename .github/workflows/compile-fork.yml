name: Compile Forked Extension

on:
  push:
    branches:
      - 'fix/steam-achievements' # ⚠️ REPLACE with your exact custom branch name (e.g., dev, feature-1)
  pull_request:
    branches:
      - 'your-branch-name' # Triggers when you open a PR targeting this branch
  workflow_dispatch: # 🚀 MANDATORY: Allows you to manually click "Run" on any branch

jobs:
  build:
    runs-on: windows-latest # Required for Playnite's Toolbox.exe

    steps:
    - name: Checkout Repository with Submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Ensure Submodules are Initialized
      run: git submodule update --init --recursive

    # 🛠️ CHANGED: Use MSBuild instead of 'dotnet' to support legacy Playnite frameworks
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v1

    # This forces the runner to download the libraries that the .csproj file is complaining about
    - name: Restore NuGet Packages
      run: nuget restore ./source/SuccessStory.sln

    # 🛠️ CHANGED: Compile using MSBuild with Release configuration
    - name: Build Plugin with MSBuild
      run: msbuild ./source/SuccessStory.sln /p:Configuration=Release /p:Platform="Any CPU"

    - name: Install Playnite via Chocolatey
      run: |
        # Installs the full application securely so we have guaranteed access to Toolbox.exe
        choco install playnite -y --no-progress

    - name: Package Extension (.pext)
      shell: pwsh
      run: |
        # 1. Create a clean, isolated staging folder for the extension contents
        $StagingDir = "./staging"
        New-Item -ItemType Directory -Force -Path $StagingDir
        New-Item -ItemType Directory -Force -Path "./build"

        # 2. Copy the compiled binaries into the staging folder
        Copy-Item -Path "./source/bin/Release/*" -Destination $StagingDir -Recurse -Force

        # 3. Explicitly copy the extension.yaml file into the root of the staging folder
        Copy-Item -Path "./source/extension.yaml" -Destination $StagingDir -Force

        # 4. Use native PowerShell to compress the folder into a standard zip package
        Compress-Archive -Path "$StagingDir/*" -DestinationPath "./build/SuccessStory.zip" -Force

        # 5. Rename the extension from .zip to Playnite's native .pext extension format
        Rename-Item -Path "./build/SuccessStory.zip" -NewName "SuccessStory.pext" -Force

    - name: Upload Compiled Addon to GitHub
      uses: actions/upload-artifact@v4
      with:
        name: playnite-extension-debug
        path: ./build/*.pext
        retention-days: 5
