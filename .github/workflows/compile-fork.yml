name: Compile Forked Extension

on:
  push:
    branches:
      - 'fix/steam-achievements' # ⚠️ REPLACE with your exact custom branch name (e.g., dev, feature-1)
  pull_request:
    branches:
      - 'your-branch-name' # Triggers when you open a PR targeting this branch
  workflow_dispatch: # 🚀 MANDATORY: Allows you to manually click "Run" on any branch

jobs:
  build:
    runs-on: windows-latest # Required for Playnite's Toolbox.exe

    steps:
    - name: Checkout Repository with Submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Ensure Submodules are Initialized
      run: git submodule update --init --recursive

    # 🛠️ CHANGED: Use MSBuild instead of 'dotnet' to support legacy Playnite frameworks
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v1

    # This forces the runner to download the libraries that the .csproj file is complaining about
    - name: Restore NuGet Packages
      run: nuget restore ./source/SuccessStory.sln

    # 🛠️ CHANGED: Compile using MSBuild with Release configuration
    - name: Build Plugin with MSBuild
      run: msbuild ./source/SuccessStory.sln /p:Configuration=Release /p:Platform="Any CPU"

    - name: Install Playnite via Chocolatey
      run: |
        # Installs the full application securely so we have guaranteed access to Toolbox.exe
        choco install playnite -y --no-progress

    - name: Package Extension (.pext)
      shell: pwsh
      run: |
        # 1. Ensure the staging build folder exists using absolute references
        $BuildOutput = (Get-Item ".").FullName + "\build"
        New-Item -ItemType Directory -Force -Path $BuildOutput

        # 2. Copy your local extension.yaml file into your compiled Release folder
        Copy-Item "./source/extension.yaml" -Destination "./source/bin/Release" -ErrorAction SilentlyContinue
        
        # 3. Resolve absolute path to your compiled binaries
        $ExtensionFolder = (Get-Item "./source/bin/Release").FullName

        # 4. Locate where Chocolatey installed Playnite's central binary folder
        $PlayniteAppDir = "C:\ProgramData\chocolatey\lib\playnite\tools\Playnite"
        if (-not (Test-Path $PlayniteAppDir)) {
            $PlayniteAppDir = "C:\Users\runneradmin\AppData\Local\Playnite"
        }

        # 🔑 FIX: Find NLog.dll from your NuGet restore cache and copy it directly into the Playnite folder
        # This completely bypasses the missing assembly exception by ensuring it sits right next to Toolbox.exe
        $CachedNLog = Get-ChildItem -Path "./source/packages" -Filter "NLog.dll" -Recurse | Select-Object -First 1
        if ($CachedNLog) {
            Copy-Item $CachedNLog.FullName -Destination $PlayniteAppDir -Force
        }

        # 5. Jump the terminal directly into Playnite's system directory so all sibling dependencies load perfectly
        Set-Location -Path $PlayniteAppDir

        # 6. Execute compilation using absolute paths for the build parameters
        ./Toolbox.exe pack "$ExtensionFolder" "$BuildOutput"

    - name: Upload Compiled Addon to GitHub
      uses: actions/upload-artifact@v4
      with:
        name: playnite-extension-debug
        path: ./build/*.pext
        retention-days: 5
