name: Compile Forked Extension

on:
  push:
    branches:
      - 'fix/steam-achievements' # ⚠️ REPLACE with your exact custom branch name (e.g., dev, feature-1)
  pull_request:
    branches:
      - 'your-branch-name' # Triggers when you open a PR targeting this branch
  workflow_dispatch: # 🚀 MANDATORY: Allows you to manually click "Run" on any branch

jobs:
  build:
    runs-on: windows-latest # Required for Playnite's Toolbox.exe

    steps:
    - name: Checkout Repository with Submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Ensure Submodules are Initialized
      run: git submodule update --init --recursive

    # 🛠️ CHANGED: Use MSBuild instead of 'dotnet' to support legacy Playnite frameworks
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v1

    # This forces the runner to download the libraries that the .csproj file is complaining about
    - name: Restore NuGet Packages
      run: nuget restore ./source/SuccessStory.sln

    # 🛠️ CHANGED: Compile using MSBuild with Release configuration
    - name: Build Plugin with MSBuild
      run: msbuild ./source/SuccessStory.sln /p:Configuration=Release /p:Platform="Any CPU"

    - name: Download Playnite Toolbox
      shell: pwsh
      run: |
        Invoke-WebRequest -Uri "https://github.com" -OutFile "Toolbox.exe"

    - name: Package Extension (.pext)
      shell: pwsh
      run: |
        # Copy the extension.yaml file into the compilation output folder so Toolbox can see it
        Copy-Item "./source/extension.yaml" -Destination "./source/bin/Release" -ErrorAction SilentlyContinue
        
        # Pack the compiled Release directory
        ./Toolbox.exe pack "./source/bin/Release" "./build"

    - name: Upload Compiled Addon to GitHub
      uses: actions/upload-artifact@v4
      with:
        name: playnite-extension-debug
        path: ./build/*.pext
        retention-days: 5
